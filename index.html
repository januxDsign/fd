<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Financial Dashboard</title>
    
    <link rel="icon" type="image/png" href="db.png">
    <link rel="apple-touch-icon" href="dbx.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finance Dash">
    <link rel="apple-touch-startup-image" href="splash.png">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #10b981; 
            --primary-dark: #059669; 
            --accent: #6366f1;
            --dark: #0f172a; 
            --light: #f1f5f9; 
            --card-bg: #ffffff; 
            --text-gray: #64748b; 
            --border: #e2e8f0; 
            --danger: #ef4444; 
        }
        /* Added overscroll-none and better touch support for iOS */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--light); 
            margin: 0; 
            padding: 20px; 
            color: var(--dark); 
            overscroll-behavior-y: none; 
            -webkit-tap-highlight-color: transparent;
        }
        .dashboard-container { max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 20px; }
        h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.5px; }
        .subtitle { color: var(--text-gray); font-size: 14px; margin-top: 5px; display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 8px; height: 8px; background: #ccc; border-radius: 50%; display: inline-block; transition: all 0.3s; }
        .status-online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        
        .header-controls { display: flex; align-items: center; gap: 15px; }
        
        .btn-sync { background-color: var(--dark); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.2s; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .btn-sync:hover { background-color: #334155; transform: translateY(-1px); }
        .btn-sync:disabled { opacity: 0.7; cursor: wait; transform: none; }
        
        select.year-select { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); font-weight: 600; outline: none; background: white; cursor: pointer; }

        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }

        .card { background: var(--card-bg); padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid transparent; transition: transform 0.2s; position: relative; display: flex; flex-direction: column; justify-content: center; }
        .card:hover { transform: translateY(-2px); }
        .card-label { color: var(--text-gray); font-size: 12px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 5px;}
        .card-value { font-size: 26px; font-weight: 700; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } 
        .card-sub { font-size: 13px; color: var(--text-gray); margin-top: 5px; opacity: 0.8; }
        
        .card-lifetime { background: var(--dark); color: white; }
        .card-lifetime .card-label { color: #94a3b8; }
        .card-lifetime .card-value { color: white; }
        .card-lifetime .card-sub { color: #cbd5e1; }
        
        @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .kpi-grid { grid-template-columns: 1fr; } }

        .charts-container { background: var(--card-bg); padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 30px; height: 350px; }
        
        .table-container { background: var(--card-bg); border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { text-align: left; color: var(--text-gray); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 10px; border-bottom: 1px solid var(--border); }
        td { padding: 16px 10px; font-size: 14px; border-bottom: 1px solid #f1f5f9; color: var(--dark); }
        
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; }
        .bg-green { background: #d1fae5; color: #065f46; } 
        .bg-red { background: #fee2e2; color: #991b1b; }

        .fab-btn { position: fixed; bottom: 40px; right: 40px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; border: none; font-size: 2rem; cursor: pointer; box-shadow: 0 10px 25px rgba(16,185,129,0.4); display: flex; align-items: center; justify-content: center; transition: transform 0.2s; z-index: 100; }
        .fab-btn:active { transform: scale(0.9); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-card { background: white; padding: 2rem; border-radius: 20px; width: 350px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); animation: slideUp 0.3s ease-out; }
        
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-gray); margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box; font-family: inherit; font-size: 14px; outline: none; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 1.5rem; }
        .btn-save { flex: 2; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .btn-cancel { flex: 1; border: 1px solid var(--border); background: transparent; cursor: pointer; border-radius: 10px; font-weight: 500; color: var(--text-gray); }

        .text-green { color: var(--primary); }
        .text-red { color: var(--danger); }
    </style>
</head>
<body>

<div class="dashboard-container">
    <header>
        <div>
            <h1>Financial Overview</h1>
            <div class="subtitle">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </div>
        <div class="header-controls">
            <button class="btn-sync" id="syncBtn" onclick="saveToCloud()">
                <span>☁️ Save Changes</span>
            </button>

            <select id="yearSelect" class="year-select" onchange="updateDashboard()">
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
            </select>
        </div>
    </header>

    <div class="kpi-grid">
        <div class="card card-lifetime">
            <div class="card-label">Lifetime Earnings</div>
            <div class="card-value" id="kpiLifetime">Loading...</div>
            <div class="card-sub">Base + Future</div>
        </div>
        <div class="card">
            <div class="card-label">Avg. Monthly</div>
            <div class="card-value" id="kpiAverage" style="font-size: 22px;">Loading...</div>
            <div class="card-sub" id="monthCountLabel">...</div>
        </div>
        <div class="card">
            <div class="card-label">Year Income</div>
            <div class="card-value text-green" id="kpiYearIncome" style="font-size: 22px;">...</div>
            <div class="card-sub">Gross Revenue</div>
        </div>
        <div class="card">
            <div class="card-label">Year Expenses</div>
            <div class="card-value text-red" id="kpiYearExpense" style="font-size: 22px;">...</div>
            <div class="card-sub">Operational Cost</div>
        </div>
        <div class="card">
            <div class="card-label">Year Net Profit</div>
            <div class="card-value" id="kpiYearProfit" style="font-size: 22px;">...</div>
            <div class="card-sub">Income - Expense</div>
        </div>
        <div class="card">
            <div class="card-label">Profit Margin</div>
            <div class="card-value" id="kpiMargin">...</div>
            <div class="card-sub">% of Income</div>
        </div>
    </div>

    <div class="charts-container">
        <canvas id="mainChart"></canvas>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>MONTH</th>
                    <th>INCOME</th>
                    <th>EXPENSES</th>
                    <th>NET FLOW</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<button class="fab-btn" onclick="openModal()">+</button>

<div class="modal-overlay" id="modal">
    <div class="modal-card">
        <h3>Update Data</h3>
        <div class="form-group">
            <label>Select Month</label>
            <select id="modalMonth" onchange="loadMonthData()">
                <option value="January">January</option><option value="February">February</option><option value="March">March</option>
                <option value="April">April</option><option value="May">May</option><option value="June">June</option>
                <option value="July">July</option><option value="August">August</option><option value="September">September</option>
                <option value="October">October</option><option value="November">November</option><option value="December">December</option>
            </select>
        </div>
        <div class="form-group">
            <label>Income</label>
            <input type="number" id="modalIncome" placeholder="0">
        </div>
        <div class="form-group">
            <label>Expenses</label>
            <input type="number" id="modalExpense" placeholder="0">
        </div>
        <div class="btn-group">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-save" onclick="updateLocalState()">Save Changes</button>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "__G_SCRIPT_URL__";
    
    let globalData = {}; 
    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    let mainChart;

    const BASE_LIFETIME_INCOME = 23376958.58;
    const BASE_MONTHS_COUNT = 89; 

    window.onload = function() {
        initCharts();
        fetchFromCloud(); 
    };

    async function fetchFromCloud() {
        setStatus(false, "Syncing...");
        try {
            const response = await fetch(GOOGLE_SCRIPT_URL);
            const data = await response.json();
            globalData = data;
            updateDashboard();
            setStatus(true, "Online & Synced");
        } catch (error) {
            console.error(error);
            setStatus(false, "Connection Error");
        }
    }

    async function saveToCloud() {
        const btn = document.getElementById('syncBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = "⏳ Saving...";
        btn.disabled = true;

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(globalData),
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" }
            });
            setStatus(true, "Saved to Cloud");
            setTimeout(() => { btn.innerHTML = "☁️ Save Changes"; btn.disabled = false; }, 2000);
        } catch (error) {
            alert("Failed to save.");
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    function setStatus(isOnline, text) {
        const dot = document.getElementById('statusDot');
        const txt = document.getElementById('statusText');
        dot.className = isOnline ? 'status-dot status-online' : 'status-dot';
        txt.innerText = text;
    }

    function updateDashboard() {
        const selectedYear = document.getElementById('yearSelect').value;
        const yearData = globalData[selectedYear] || {};
        
        let currentYearInc = 0, currentYearExp = 0;
        let incArr = [], expArr = [];
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        monthNames.forEach(month => {
            const mData = yearData[month] || { inc: 0, exp: 0 };
            currentYearInc += mData.inc; 
            currentYearExp += mData.exp;
            incArr.push(mData.inc); 
            expArr.push(mData.exp);

            if(mData.inc !== 0 || mData.exp !== 0) {
                const net = mData.inc - mData.exp;
                const isProfit = net >= 0;
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:600">${month}</td>
                        <td>${formatStandard(mData.inc)}</td>
                        <td>${formatStandard(mData.exp)}</td>
                        <td style="color:${isProfit?'#10b981':'#ef4444'};font-weight:bold;">
                            ${isProfit?'+':''}${formatStandard(net)}
                        </td>
                        <td><span class="status-badge ${isProfit?'bg-green':'bg-red'}">${isProfit?'Profit':'Loss'}</span></td>
                    </tr>`;
            }
        });

        let totalLifetimeIncome = BASE_LIFETIME_INCOME;
        let totalMonthsCount = BASE_MONTHS_COUNT;

        for (const yr in globalData) {
            if (parseInt(yr) > 2025) { 
                const yrObj = globalData[yr];
                for (const m in yrObj) {
                    const val = yrObj[m].inc || 0;
                    if (val > 0) {
                        totalLifetimeIncome += val;
                        totalMonthsCount++;
                    }
                }
            }
        }

        const avgMonthly = totalLifetimeIncome / totalMonthsCount;
        const yearProfit = currentYearInc - currentYearExp;
        const margin = currentYearInc > 0 ? ((yearProfit / currentYearInc) * 100).toFixed(1) : 0;

        document.getElementById('kpiLifetime').textContent = formatMoney(totalLifetimeIncome);
        document.getElementById('kpiAverage').textContent = formatMoneyLong(avgMonthly);
        document.getElementById('monthCountLabel').textContent = `Based on ${totalMonthsCount} months`;
        document.getElementById('kpiYearIncome').textContent = formatStandard(currentYearInc);
        document.getElementById('kpiYearExpense').textContent = formatStandard(currentYearExp);
        document.getElementById('kpiYearProfit').textContent = formatMoneyLong(yearProfit);
        document.getElementById('kpiYearProfit').style.color = yearProfit >= 0 ? '#10b981' : '#ef4444';
        document.getElementById('kpiMargin').textContent = margin + '%';
        
        mainChart.data.datasets[0].data = incArr;
        mainChart.data.datasets[1].data = expArr;
        mainChart.update();
    }

    function formatMoney(num) {
        const absNum = Math.abs(num);
        return (num < 0 ? "-" : "") + (absNum / 1000000).toFixed(2) + 'M';
    }

    function formatStandard(num) {
        return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatMoneyLong(num) {
        return 'Rs. ' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function openModal() { document.getElementById('modal').style.display = 'flex'; loadMonthData(); }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    
    function loadMonthData() {
        const year = document.getElementById('yearSelect').value;
        const month = document.getElementById('modalMonth').value;
        const data = (globalData[year] && globalData[year][month]) ? globalData[year][month] : { inc: 0, exp: 0 };
        document.getElementById('modalIncome').value = data.inc || 0;
        document.getElementById('modalExpense').value = data.exp || 0;
    }

    function updateLocalState() {
        const year = document.getElementById('yearSelect').value;
        const month = document.getElementById('modalMonth').value;
        const inc = parseFloat(document.getElementById('modalIncome').value) || 0;
        const exp = parseFloat(document.getElementById('modalExpense').value) || 0;
        if(!globalData[year]) globalData[year] = {};
        globalData[year][month] = { inc: inc, exp: exp };
        closeModal();
        updateDashboard();
        setStatus(false, "Unsaved Changes...");
    }

    function initCharts() {
        const ctx1 = document.getElementById('mainChart').getContext('2d');
        mainChart = new Chart(ctx1, {
            type: 'line',
            data: { 
                labels: monthNames, 
                datasets: [
                    { 
                        label: 'Income', 
                        data: [], 
                        borderColor: '#10b981', 
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true, 
                        tension: 0.4,
                        borderWidth: 3
                    }, 
                    { 
                        label: 'Expenses', 
                        data: [], 
                        borderColor: '#ef4444', 
                        borderDash: [5,5],
                        tension: 0.4,
                        borderWidth: 2
                    }
                ] 
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: { legend: { display: true, position: 'top' } }, 
                scales: { 
                    x: { grid: { display: false } },
                    y: { grid: { color: '#f1f5f9' } }
                } 
            }
        });
    }
</script>
</body>
</html>
